[project]
name = "jarvis"
version = "0.4.1"
description = "贾维斯 —— 私人 AI 助手框架（Python + LLM + TUI）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
